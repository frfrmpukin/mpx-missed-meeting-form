{% extends "allianceauth/base-bs5.html" %}

{% block page_title %}Edit missed meeting report{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1>Edit missed meeting report</h1>
    <p>Current meeting date: {{ report.meeting_date|date:"F j, Y" }}</p>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{% url 'missed_meetings:my_reports' %}">Cancel</a>
    </form>
</div>
{% endblock %}
