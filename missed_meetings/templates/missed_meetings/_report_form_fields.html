<div class="mb-3">
    <label for="{{ form.meeting_date.id_for_label }}" class="form-label">
        {{ form.meeting_date.label }}
    </label>
    {{ form.meeting_date }}
    {% for error in form.meeting_date.errors %}
    <div class="invalid-feedback d-block">{{ error }}</div>
    {% endfor %}
</div>

<div class="mb-3">
    <label for="{{ form.comments.id_for_label }}" class="form-label">
        {{ form.comments.label }}
    </label>
    {{ form.comments }}
    {% if form.comments.help_text %}
    <div class="form-text">{{ form.comments.help_text }}</div>
    {% endif %}
    {% for error in form.comments.errors %}
    <div class="invalid-feedback d-block">{{ error }}</div>
    {% endfor %}
</div>
